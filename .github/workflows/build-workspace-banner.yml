name: Build animated workspace banner

on:
  push:
    branches:
      - main
    paths:
      - "assets-source/workspace-gif-*.b64"
      - ".github/workflows/build-workspace-banner.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workspace-banner-build
  cancel-in-progress: false

jobs:
  assemble:
    name: Assemble and verify workspace GIF
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Assemble GIF from staged chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat assets-source/workspace-gif-*.b64 | tr -d '\r\n ' | base64 --decode > assets/workspace-hero.gif
          file assets/workspace-hero.gif
          test "$(file -b assets/workspace-hero.gif | cut -c1-6)" = "GIF im"

      - name: Install image validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

      - name: Verify decoded animation
        shell: bash
        run: |
          set -euo pipefail
          frames=$(identify assets/workspace-hero.gif | wc -l)
          dimensions=$(identify -format '%wx%h\n' assets/workspace-hero.gif | sort -u)
          echo "Frames: $frames"
          echo "Dimensions: $dimensions"
          sha256sum assets/workspace-hero.gif
          test "$frames" -eq 8
          test "$dimensions" = "480x160"

      - name: Commit verified GIF and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/workspace-hero.gif assets-source
          git commit -m "chore(profile): publish verified animated workspace banner"
          git push

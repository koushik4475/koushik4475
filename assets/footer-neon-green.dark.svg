<svg xmlns="http://www.w3.org/2000/svg" width="960" height="104" viewBox="0 0 960 104" role="img" aria-labelledby="title desc">
  <title id="title">Koushik's profile footer quote</title>
  <desc id="desc">Code is like humor. When you have to explain it, it's bad. — Cory House.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d353" stop-opacity=".9"/>
      <stop offset="1" stop-color="#39d353" stop-opacity=".08"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M20 37 H184" stroke="url(#line)" stroke-width="1.5"/>
  <path d="M776 37 H940" stroke="url(#line)" stroke-width="1.5" transform="rotate(180 858 37)"/>
  <text x="480" y="34" text-anchor="middle" fill="#e6edf3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-style="italic" font-weight="600">“Code is like humor. When you have to explain it, it's bad.”</text>
  <text x="480" y="60" text-anchor="middle" fill="#39d353" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" filter="url(#glow)">— Cory House</text>
  <path d="M20 88 C150 68 238 100 360 82 S570 72 690 86 S840 100 940 78" fill="none" stroke="#39d353" stroke-opacity=".42" stroke-width="1.4"/>
  <path d="M20 94 C150 78 240 104 370 90 S590 82 710 94 S850 104 940 88" fill="none" stroke="#39d353" stroke-opacity=".16" stroke-width="1"/>
</svg>
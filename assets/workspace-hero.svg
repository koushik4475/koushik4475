<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Koushik HY — Feature Engineer and Product Builder</title>
<desc id="desc">A custom dark developer workspace illustration with a glowing monitor, code editor, desk lamp, books, plant and green ambient lighting.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07100b"/><stop offset=".58" stop-color="#101b17"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1720"/><stop offset="1" stop-color="#06110d"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39d353"/><stop offset="1" stop-color="#9be9a8"/></linearGradient>
 <radialGradient id="ambient"><stop offset="0" stop-color="#39d353" stop-opacity=".35"/><stop offset="1" stop-color="#39d353" stop-opacity="0"/></radialGradient>
 <radialGradient id="blue"><stop offset="0" stop-color="#58a6ff" stop-opacity=".16"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8b949e" stroke-opacity=".07"/></pattern>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10"/></filter>
 <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="1200" height="400" rx="20" fill="url(#bg)"/>
<rect width="1200" height="400" rx="20" fill="url(#grid)"/>
<circle cx="850" cy="245" r="290" fill="url(#ambient)"><animate attributeName="opacity" values=".55;1;.55" dur="8s" repeatCount="indefinite"/></circle>
<circle cx="1100" cy="55" r="230" fill="url(#blue)"><animate attributeName="opacity" values=".5;.9;.5" dur="10s" repeatCount="indefinite"/></circle>
<!-- Left identity -->
<rect x="62" y="54" width="400" height="40" rx="20" fill="#0b2414" stroke="#2ea043" stroke-opacity=".8"/>
<circle cx="84" cy="74" r="5" fill="#39d353"/>
<text x="102" y="80" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#9be9a8">PRODUCT ENGINEERING  /  DEV TOOLS</text>
<text x="62" y="178" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="800" fill="#f0f6fc">Koushik <tspan fill="url(#green)">HY</tspan></text>
<text x="67" y="226" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="2" fill="#e6edf3">FEATURE ENGINEER  ·  PRODUCT BUILDER</text>
<rect x="67" y="254" width="5" height="64" rx="2" fill="#39d353"/>
<text x="88" y="276" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#c9d1d9">Building useful products, automating workflows,</text>
<text x="88" y="305" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#c9d1d9">and turning ideas into dependable software.</text>
<g font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing=".7">
 <rect x="66" y="338" width="116" height="34" rx="17" fill="#102719" stroke="#2ea043"/><circle cx="83" cy="355" r="4" fill="#39d353"/><text x="97" y="359" fill="#d7f7dd">BUILD</text>
 <rect x="194" y="338" width="148" height="34" rx="17" fill="#102719" stroke="#2ea043"/><circle cx="211" cy="355" r="4" fill="#39d353"/><text x="225" y="359" fill="#d7f7dd">AUTOMATE</text>
 <rect x="354" y="338" width="104" height="34" rx="17" fill="#102719" stroke="#2ea043"/><circle cx="371" cy="355" r="4" fill="#39d353"/><text x="385" y="359" fill="#d7f7dd">SHIP</text>
 <rect x="470" y="338" width="126" height="34" rx="17" fill="#102719" stroke="#2ea043"/><circle cx="487" cy="355" r="4" fill="#39d353"/><text x="501" y="359" fill="#d7f7dd">IMPROVE</text>
</g>
<!-- Workspace desk -->
<ellipse cx="925" cy="330" rx="315" ry="40" fill="#39d353" opacity=".18" filter="url(#glow)"/>
<path d="M600 305H1190L1200 335H586Z" fill="#1c241f" stroke="#53645a" stroke-opacity=".65"/>
<path d="M604 308H1190" stroke="#ba8a56" stroke-opacity=".4" stroke-width="3"/>
<path d="M660 336L647 400M1138 336L1158 400" stroke="#202a25" stroke-width="14"/>

<!-- Desk lamp -->
<path d="M770 280L796 175L861 122" fill="none" stroke="#414d48" stroke-width="10" stroke-linecap="round"/>
<circle cx="796" cy="175" r="8" fill="#64766d" stroke="#a7b9ad"/>
<path d="M845 112L913 107L892 149L821 155Z" fill="#313c36" stroke="#84958a" stroke-width="2"/>
<path d="M832 151L895 147L879 183L848 183Z" fill="#d6b47a" opacity=".2"/>
<path d="M840 177L881 177" stroke="#e8c58b" stroke-width="3" opacity=".7"/>
<!-- Trailing plant -->
<path d="M1122 0C1118 35 1082 42 1103 84C1120 114 1074 132 1093 159" fill="none" stroke="#47794d" stroke-width="5"/>
<g fill="#2c8a45" stroke="#77bd72" stroke-opacity=".55">
 <path d="M1113 45C1074 31 1064 6 1084 5C1106 7 1118 25 1113 45Z"/>
 <path d="M1103 91C1068 78 1057 55 1076 53C1098 56 1110 71 1103 91Z"/>
 <path d="M1095 135C1060 123 1052 99 1072 96C1091 99 1103 116 1095 135Z"/>
 <path d="M1127 40C1149 7 1172 8 1167 27C1161 46 1144 50 1127 40Z"/>
 <path d="M1116 86C1143 56 1166 60 1158 78C1148 95 1131 98 1116 86Z"/>
</g>
<!-- Monitor with subtle ambient screen glow -->
<rect x="903" y="72" width="258" height="181" rx="12" fill="#07110d" stroke="#75847c" stroke-width="3"/>
<rect x="913" y="82" width="238" height="161" rx="6" fill="url(#screen)"/>
<rect x="913" y="82" width="238" height="161" rx="6" fill="#39d353" opacity=".07"><animate attributeName="opacity" values=".03;.10;.03" dur="7s" repeatCount="indefinite"/></rect>
<circle cx="1033" cy="76" r="2.5" fill="#39d353"/>
<g stroke-linecap="round" stroke-width="3">
 <path d="M929 101H989M929 115H1031M929 129H1002M929 143H1065M929 157H1019M929 171H1082M929 185H1022M929 199H1060M929 213H1004" stroke="#4b6a58" opacity=".8"/>
 <path d="M940 101H966M958 115H984M947 129H974M971 143H1001M948 157H978M990 171H1014M947 185H974M968 199H996M946 213H972" stroke="#39d353" opacity=".95"/>
 <path d="M977 101H1004M995 129H1024M1010 157H1041M1022 185H1050M1006 213H1040" stroke="#58a6ff" opacity=".75"/>
</g>
<path d="M1028 253V274M1035 253V274" stroke="#75847c" stroke-width="8"/>
<path d="M981 277H1082L1100 287H964Z" fill="#46564c" stroke="#7c8f82"/>
<!-- Keyboard -->
<rect x="882" y="294" width="241" height="17" rx="6" fill="#111a15" stroke="#65766b"/>
<g stroke="#53685a" stroke-width="2">
 <path d="M896 300H1108M902 306H1103M916 294V310M940 294V310M964 294V310M988 294V310M1012 294V310M1036 294V310M1060 294V310M1084 294V310"/>
</g>
<!-- Mug -->
<rect x="792" y="275" width="42" height="43" rx="8" fill="#172b20" stroke="#6d9272" stroke-width="2"/>
<path d="M834 286C855 284 853 309 834 309" fill="none" stroke="#6d9272" stroke-width="5"/>
<path d="M803 267C794 256 811 250 803 238M817 267C809 257 826 250 819 239" fill="none" stroke="#b9c3bb" stroke-opacity=".38" stroke-width="3" stroke-linecap="round"><animate attributeName="opacity" values=".15;.55;.15" dur="5s" repeatCount="indefinite"/></path>
<!-- Headphones -->
<path d="M1126 166C1126 112 1190 112 1190 166" fill="none" stroke="#4c5c54" stroke-width="12" stroke-linecap="round"/>
<rect x="1116" y="158" width="20" height="48" rx="9" fill="#17231c" stroke="#789184" stroke-width="2"/>
<rect x="1180" y="158" width="20" height="48" rx="9" fill="#17231c" stroke="#789184" stroke-width="2"/>
<!-- Floating ambient particles -->
<g fill="#39d353">
 <circle cx="830" cy="52" r="2"><animate attributeName="cy" values="52;41;52" dur="6s" repeatCount="indefinite"/></circle>
 <circle cx="1191" cy="48" r="3" opacity=".6"><animate attributeName="opacity" values=".2;.8;.2" dur="4s" repeatCount="indefinite"/></circle>
 <circle cx="867" cy="225" r="2" opacity=".7"><animate attributeName="opacity" values=".15;.75;.15" dur="5s" repeatCount="indefinite"/></circle>
</g>
<rect x="1" y="1" width="1198" height="398" rx="19" fill="none" stroke="#2ea043" stroke-opacity=".55"/>
</svg>